name = "majestic-blazer-router"
main = "worker.js"
compatibility_date = "2024-11-01"

# Production Routes for unified apex and www domains
routes = [
  { pattern = "majesticblazer.com/*", zone_name = "majesticblazer.com" },
  { pattern = "www.majesticblazer.com/*", zone_name = "majesticblazer.com" }
]

# Upstream Origin Endpoints (Production Default)
[vars]
CUSTOMER_ORIGIN = "https://majestic-blazer.vercel.app"
ADMIN_ORIGIN = "https://majestic-blazer-miup.vercel.app"
BACKEND_ORIGIN = "https://majestic-blazer-production.up.railway.app"

# Local Development Environment (Run: npx wrangler dev --env local)
[env.local]
dev = { port = 8787 }

[env.local.vars]
CUSTOMER_ORIGIN = "http://localhost:5173"
ADMIN_ORIGIN = "http://localhost:5174"
BACKEND_ORIGIN = "http://localhost:5000"
